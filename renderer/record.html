<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'">
<title>スクショ — 録画</title>
<link rel="stylesheet" href="record.css">
</head>
<body>

<!-- 録画中に出る細い操作バー -->
<div id="bar">
  <span id="dot"></span>
  <span id="time">0:00</span>
  <span id="note">準備しています…</span>
  <span class="spacer"></span>
  <button id="btnStop" class="primary">停止</button>
  <button id="btnCancel">やめる</button>
</div>

<!-- 止めたあとの確認と保存 -->
<div id="done" hidden>
  <div id="stage"><video id="prev" loop autoplay muted playsinline></video></div>
  <p id="stat"></p>
  <div id="btns">
    <button id="btnVideo" class="primary" title="止めた時点で保存済みです。別の名前に変えたいときだけ押します">動画に名前を付ける</button>
    <button id="btnGif" title="止めた時点で保存済みです。別の名前に変えたいときだけ押します">GIFに名前を付ける</button>
    <button id="btnFolder">フォルダを開く</button>
    <span class="spacer"></span>
    <button id="btnClose">閉じる</button>
  </div>
  <p id="msg"></p>
</div>

<!-- 画面の取り込みと切り抜きに使う。画面には出さない -->
<div id="work">
  <video id="src" muted playsinline></video>
  <canvas id="cv"></canvas>
  <canvas id="gcv"></canvas>
  <canvas id="tcv"></canvas>
</div>

<script src="../lib/gif.js"></script>
<script src="record.js"></script>
</body>
</html>
